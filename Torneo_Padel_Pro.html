<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torneo Pádel PRO</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f9}.header{background:#00a86b;color:#fff;padding:16px;text-align:center}.container{padding:20px}.card{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:15px}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left}button{background:#00a86b;color:#fff;border:none;padding:8px 12px;border-radius:6px}canvas{max-height:350px}</style></head><body><div class="header"><h1>🏆 Torneo Pádel PRO</h1></div><div class="container"><div class="card"><h2>Clasificación</h2><table><thead><tr><th>Jugador</th><th>Puntos</th></tr></thead><tbody id="ranking"></tbody></table></div><div class="card"><h2>Gráfico de puntos</h2><canvas id="chart"></canvas></div></div><script>const players=['Jaxter','Manu','Wave','Chemita','Rodders','Xems','Moren','Javi Phe','Phector','Antonio','Antoñito','Alber'];let points={};players.forEach(p=>points[p]=0);function render(){document.getElementById('ranking').innerHTML=players.map(p=>`<tr><td>${p}</td><td>${points[p]}</td></tr>`).join('');new Chart(document.getElementById('chart'),{type:'bar',data:{labels:players,datasets:[{label:'Puntos',data:players.map(p=>points[p])}]}});}render();</script></body></html>
